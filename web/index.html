<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CybCore — живая память</title>
<style>body{margin:0;background:#09110e;color:#e5f4ea;font:16px system-ui}main{max-width:840px;margin:8vh auto;padding:24px}h1{font-size:clamp(32px,7vw,64px);letter-spacing:-2px}p{color:#a2baac}section{border:1px solid #284536;border-radius:18px;padding:24px;margin:20px 0;background:#102019}label{display:block;margin:14px 0}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #395742;border-radius:8px;background:#09110e;color:inherit;font:inherit}button{padding:12px 22px;background:#98ffbd;border:0;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px system-ui;color:#a7dabb}.tag{font-size:12px;letter-spacing:3px;color:#98ffbd}</style>
<main><div class="tag">CYBCORE · АГЕНТЫ И ЗНАНИЯ</div><h1>Память, к которой<br>можно вернуться.</h1><p>Агент keeper сохраняет знания вместе с источником. Они остаются доступными после перезапуска.</p>
<section><h2>Сохранить знание</h2><form id="remember"><label>Наблюдение<textarea id="content" required maxlength="8000"></textarea></label><label>Источник<input id="source" required maxlength="256" placeholder="Например: журнал пасеки"></label><button>Сохранить</button></form></section>
<section><h2>Найти в памяти</h2><form id="recall"><label>Поисковые слова<input id="query" required maxlength="256"></label><button>Найти</button></form></section><section aria-live="polite"><h2>Результат</h2><pre id="result">Готов к работе.</pre></section><p><a href="/docs" style="color:#98ffbd">API и схема данных →</a></p></main>
<script>
for(const name of ['remember','recall'])document.getElementById(name).addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;const body={task_id:crypto.randomUUID(),agent_ids:['keeper'],capability:'memory.'+name};if(name==='remember'){body.content=document.getElementById('content').value;body.source=document.getElementById('source').value}else body.query=document.getElementById('query').value;try{const response=await fetch('/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Проверьте заполненные поля');const records=data.events.flatMap(event=>Array.isArray(event.result)?event.result:[event.result]);document.getElementById('result').textContent=(name==='remember'?'Сохранено.':'Найдено записей: '+records.length)+(records.length?'\n\n'+records.map(record=>record.content+'\nИсточник: '+record.source+'\nАгент: '+record.agent_id).join('\n\n'):'')}catch(error){document.getElementById('result').textContent=error.message}finally{button.disabled=false}});
</script></html>
